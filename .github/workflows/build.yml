name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags for setuptools-scm
          submodules: recursive

      # setuptools-scm can't read git inside the manylinux container, so compute the version
      # once on the runner and pass it to every build via SETUPTOOLS_SCM_PRETEND_VERSION.
      - name: Compute version
        shell: bash
        run: echo "SCM_VERSION=$(pipx run setuptools-scm)" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.1
        with:
          output-dir: wheelhouse
        env:
          # Keep MACOSX_DEPLOYMENT_TARGET here too — CIBW_ENVIRONMENT replaces (not merges) the
          # pyproject environment, so it must carry every var the build needs.
          CIBW_ENVIRONMENT: "SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.SCM_VERSION }} MACOSX_DEPLOYMENT_TARGET=11.0"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build SDist
        shell: bash
        run: SETUPTOOLS_SCM_PRETEND_VERSION="$(pipx run setuptools-scm)" pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Publish to PyPI on every push to main. Versions come from setuptools-scm (a unique 0.1.1.devN per
  # commit), so every push publishes; skip-existing guards against re-runs of the same commit.
  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/compas_nest
    permissions:
      id-token: write   # OIDC trusted publishing (no API token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
