site_name: compas_nest
site_description: 2D irregular nesting (OpenNest) for COMPAS
repo_url: https://github.com/petrasvestartas/compas_nest
site_author: Petras Vestartas

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme)"
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow

nav:
  - Home: index.md
  - Installation: installation.md
  - Examples:
      - examples/index.md
      - 01 Collision: examples/01_collision_viewer.md
      - 02 NFP + GA: examples/02_nfp_viewer.md
      - 03 Live animation (NFP): examples/03_nfp_animated.md
      - 04 Clearance offset: examples/04_collision_dataset.md
      - 05 Attributes: examples/05_attributes.md
      - 06 Pack (array): examples/06_pack_array.md
      - 07 Pack (distance): examples/07_pack_distance.md
      - 08 Text (font): examples/08_text.md
  - API Reference:
      - api/index.md
      - Data structures: api/compas_nest.datastructures.md
      - Collision engine: api/compas_nest.collision.md
      - NFP engine: api/compas_nest.nfp.md
      - Result: api/compas_nest.result.md
      - Offsetting: api/compas_nest.offset.md
      - Pack (grid): api/compas_nest.pack.md
      - Text (font): api/compas_nest.text.md
      - Viewer: api/compas_nest.viewer.md
  - Credits: credits.md
  - Changelog: changelog.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: true
            members_order: source

markdown_extensions:
  - admonition
  - markdown_callouts
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true
