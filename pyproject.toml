[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=2.12", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "compas_nest"
description = "2D irregular nesting (OpenNest) for COMPAS."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Petras Vestartas", email = "petrasvestartas@gmail.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "compas>=2.15,<3",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/petrasvestartas/compas_nest"
Repository = "https://github.com/petrasvestartas/compas_nest"

# ============================================================================
# scikit-build-core
# ============================================================================

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
wheel.packages = ["src/compas_nest"]
cmake.version = ">=3.15"
cmake.build-type = "Release"
sdist.include = ["external/nest/**"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
# PEP440-clean versions so every push is uploadable to PyPI: 0.1.1.dev3 (not ...+gHASH)
local_scheme = "no-local-version"

[tool.scikit-build.cmake.define]
CMAKE_POLICY_DEFAULT_CMP0135 = "NEW"

# ============================================================================
# cibuildwheel
# ============================================================================

[tool.cibuildwheel]
# We ship a single cp312 abi3 wheel per platform (wheel.py-api = "cp312"), so build once.
build = ["cp312-*"]
build-verbosity = 1
test-requires = ["numpy>=1.24", "compas>=2.15", "pytest"]
test-command = "pytest {project}/tests"
build-frontend = "pip"
manylinux-x86_64-image = "manylinux_2_28"
skip = ["*_i686", "*-musllinux_*", "*-win32", "pp*"]
# Pull in the C++ submodule sources before building each wheel.
before-all = "git submodule update --init --recursive"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# Note: MACOSX_DEPLOYMENT_TARGET is set via CIBW_ENVIRONMENT in build.yml (alongside the scm
# version) so it is not clobbered by that variable.

# ============================================================================
# pytest / ruff
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = ["-ra", "--tb=short", "--import-mode=importlib"]

[tool.ruff]
line-length = 179
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
